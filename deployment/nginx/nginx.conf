# ==============================================================================
# Production Nginx Configuration for Next.js (Node.js) Web Application
# Bao gom: Chặn Bad Bots, Rate Limiting, Cloudflare Real IP, Caching va SSL
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Tối ưu hóa I/O
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # ==========================================================================
    # 1. BẢNG TRA CHẶN BAD BOTS & CÔNG CỤ DÒ QUÉT TỰ ĐỘNG
    # ==========================================================================
    map $http_user_agent $is_bad_bot {
        default 0;
        ~*(sqlmap|nikto|wpscan|masscan|zgrab|acunetix|nessus|nmap|havij|morfeus|dirbuster|python-requests|curl) 1;
    }

    # ==========================================================================
    # 2. KHÔI PHỤC IP THẬT TỪ CLOUDFLARE (Real IP)
    # ==========================================================================
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    # ==========================================================================
    # 3. RATE LIMITING ZONES (Shared Memory)
    # ==========================================================================
    # Giới hạn API thông thường: 15 req/s cho mỗi IP
    limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=15r/s;
    # Giới hạn API đăng nhập/OTP: 2 req/s cho mỗi IP
    limit_req_zone $binary_remote_addr zone=api_auth_limit:10m rate=2r/s;
    # Mã HTTP trả về khi vượt ngưỡng
    limit_req_status 429;

    # ==========================================================================
    # 4. GZIP COMPRESSION
    # ==========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    upstream nextjs_upstream {
        server 127.0.0.1:3000;
        keepalive 64;
    }

    server {
        listen 80;
        server_name app.yourdomain.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name app.yourdomain.com;

        # SSL Configuration
        ssl_certificate /etc/nginx/ssl/live/app.yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/app.yourdomain.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Chặn ngay nếu là scanner / bot độc hại
        if ($is_bad_bot) {
            return 403;
        }

        # ======================================================================
        # 5. CACHING CHO STATIC ASSETS (Fingerprinted JS/CSS/Fonts)
        # ======================================================================
        location /_next/static/ {
            proxy_pass http://nextjs_upstream;
            proxy_cache_bypass $http_upgrade;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        location ~* \.(?:ico|png|jpg|jpeg|svg|webp|avif|woff2?)$ {
            proxy_pass http://nextjs_upstream;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # ======================================================================
        # 6. RATE LIMITING CHO AUTHENTICATION API
        # ======================================================================
        location ~* ^/api/(auth|register|login|send-otp) {
            limit_req zone=api_auth_limit burst=5 nodelay;

            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ======================================================================
        # 7. ROUTING TOÀN BỘ APP & API KHÁC
        # ======================================================================
        location /api/ {
            limit_req zone=api_general_limit burst=30 nodelay;

            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
