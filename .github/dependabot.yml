version: 2
updates:
  # Gom bản vá nhỏ (minor/patch) hàng tuần vào 1 PR duy nhất để dễ review.
  # Bản nâng cấp lớn (major: TypeScript 7, ESLint 10, ...) có thể phá build,
  # nên bỏ qua ở đây và nâng cấp thủ công khi có kế hoạch kiểm thử riêng.
  # Cảnh báo bảo mật (security updates) vẫn được Dependabot mở PR như bình thường.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
