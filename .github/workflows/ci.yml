name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Huỷ lượt chạy cũ của cùng nhánh khi có commit mới để tiết kiệm phút CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_password_123
          POSTGRES_DB: quanlihocau_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://ci:ci_password_123@localhost:5432/quanlihocau_ci?schema=public"
      NEXTAUTH_SECRET: "ci-only-secret-not-used-in-production"
      NEXTAUTH_URL: "http://localhost:3000"
      SESSION_SECRET: "ci-only-session-secret-not-used-in-production"
      BANK_WEBHOOK_SECRET: "ci-bank-webhook-secret"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Node 24 khớp với runtime của Vercel (24.x) và hỗ trợ test import trực tiếp file .ts.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate and generate
        run: |
          npx prisma validate
          npx prisma generate

      - name: Apply CI migrations
        run: npx prisma migrate deploy

      - name: Run release check suite
        run: npm run check:release
