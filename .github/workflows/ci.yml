name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_password_123
          POSTGRES_DB: quanlihocau_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://ci:ci_password_123@localhost:5432/quanlihocau_ci?schema=public"
      NEXTAUTH_SECRET: "ci-only-secret-not-used-in-production"
      NEXTAUTH_URL: "http://localhost:3000"
      SESSION_SECRET: "ci-only-session-secret-not-used-in-production"
      BANK_WEBHOOK_SECRET: "ci-bank-webhook-secret"
      CRON_SECRET: "ci-cron-secret"
      SAAS_TEST_ISOLATED: "1"
      TEST_BASE_URL: "http://127.0.0.1:3102"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate and generate
        run: |
          npx prisma validate
          npx prisma generate

      - name: Apply CI migrations
        run: npx prisma migrate deploy

      - name: Navigation source audit
        run: npm run check:navigation

      - name: Safety and permission tests
        run: npm run test:safety

      - name: ESLint check
        run: npm run lint

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Verify migrated database matches schema
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Real API integration, concurrent quotas and recovery drill
        run: node scripts/check-staging.mjs

      - name: Save sanitized recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-recovery-evidence
          path: .staging/recovery/result.json
          if-no-files-found: ignore

      - name: Guest navigation smoke test
        run: npm run test:guest-navigation
