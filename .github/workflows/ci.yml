name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prisma Validate
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/quanlihocau_ci

      - name: Prisma Generate
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/quanlihocau_ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
