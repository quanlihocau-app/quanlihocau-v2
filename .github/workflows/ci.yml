name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_password_123
          POSTGRES_DB: quanlihocau_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://ci:ci_password_123@localhost:5432/quanlihocau_ci?schema=public"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prisma validate and generate
        run: |
          npx prisma validate
          npx prisma generate
      - name: Apply CI migrations
        run: npx prisma migrate deploy
      - name: Static checks
        run: |
          npm run lint
          npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Registration integration tests
        shell: bash
        run: |
          set -euo pipefail
          PID_3101=""
          PID_3102=""

          cleanup() {
            for pid in "$PID_3101" "$PID_3102"; do
              if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then
                kill "$pid" 2>/dev/null || true
                for _ in $(seq 1 10); do
                  kill -0 "$pid" 2>/dev/null || break
                  sleep 0.2
                done
                kill -0 "$pid" 2>/dev/null && kill -9 "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
              fi
            done
          }
          trap cleanup EXIT

          wait_for_server() {
            local url="$1"
            local label="$2"
            for _ in $(seq 1 30); do
              curl --fail --silent --max-time 2 "$url" > /dev/null && return 0
              sleep 1
            done
            echo "$label did not become ready within 30 seconds" >&2
            return 1
          }

          PORT=3101 npx next start -p 3101 &
          PID_3101=$!
          DATABASE_URL="postgresql://ci:ci_password_123@localhost:59999/quanlihocau_ci?connect_timeout=2" PORT=3102 npx next start -p 3102 &
          PID_3102=$!

          wait_for_server "http://localhost:3101" "Server 3101"
          wait_for_server "http://localhost:3102" "Server 3102"
          curl --fail --silent --max-time 5 http://localhost:3101 > /dev/null
          curl --fail --silent --max-time 5 http://localhost:3102 > /dev/null

          TEST_DATABASE_URL="$DATABASE_URL" TEST_BASE_URL="http://localhost:3101" TEST_UNAVAILABLE_BASE_URL="http://localhost:3102" node --test tests/register.integration.test.mjs
